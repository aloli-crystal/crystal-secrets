name: secrets
version: 0.3.0
description: |
  Secrets management for the Aloli Crystal ecosystem: a TOML vault
  encrypted with age, a master key stored in the macOS Keychain
  (synced through iCloud), and a Diceware-protected paper recovery
  code. v0.2 wires up the official aloli-crystal/toml and
  aloli-crystal/diceware shards (v0.1.x), gaining comment
  preservation in vaults and a maintained Diceware backend.
authors:
  - Philippe Nénert <philippe@aloli.fr>
license: MIT
crystal: ">= 1.19.0"

targets:
  secrets:
    main: src/cli.cr

dependencies:
  toml:
    github: aloli-crystal/toml
    version: "~> 0.1.1"
  diceware:
    github: aloli-crystal/diceware
    version: "~> 0.1.4"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
