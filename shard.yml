name: crystal-secrets
version: 0.1.0
description: |
  Secrets management for the Aloli Crystal ecosystem: a TOML vault
  encrypted with age, a master key stored in the macOS Keychain
  (synced through iCloud), and a Diceware-protected paper recovery
  code. v0.1 is single-user / single-recipient and macOS-only;
  multi-recipient (team) and other-OS backends arrive in v0.2+.
authors:
  - Philippe Nénert <philippe@aloli.fr>
license: MIT
crystal: ">= 1.19.0"

targets:
  crystal-secrets:
    main: src/cli.cr

dependencies:
  toml:
    github: crystal-community/TOML.cr
    version: "~> 0.8"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
